[project]
name = "claims-auditor-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.139.0",
    "google-genai>=2.10.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "sqlalchemy-utils>=0.42.1",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.50.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "rag_eval: live RAG quality evaluation requiring GEMINI_API_KEY",
]
